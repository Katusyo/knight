<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knight Travails</title>
    <style>
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        #status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f1c40f;
            height: 30px;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #374e64;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            cursor:pointer;
            user-select: none;
            transition: background-color 0.2s, transform 0.2s;
        }
        .light { background-color: #ecd6b3; color: #b38661;}
        .dark { background-color: #b38661; color: #ecd6b3;}
        .square:hover { filter: brightness(1.1); transform: scale(1.05); }
        .start { background-color: #2ecc71 !important; color: white !important; font-weight: bold; }
        .end { background-color: #e74c3c !important; color: white !important; font-weight: bold; }
        .path { background-color: #3498db !important; color: white !important; font-weight: bold; }
    </style>
<script defer src="main.js"></script></head>
<body>
    <h1>Knight Travails</h1>
    <div id="status">Select a square to begin!</div>
    <div id="board"></div>   
</body>
</html>
